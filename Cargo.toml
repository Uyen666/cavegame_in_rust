[package]
name = "cave_game" # Updated to snake_case for rust norms
version = "0.1.0"
edition = "2021" # Bevy 0.14 requires 2021 edition

[dependencies]
bevy = "0.14"
bincode = "1.3.3"
futures-lite = "2.6.1"
image = "0.25.10"
noise = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
zip = "8.6.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Optimize for release
[profile.release]
lto = "thin"
